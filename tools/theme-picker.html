<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selector de temas</title>

  <!--
    Internal tool for comparing globe themes and speeds. Not part of the website.
    The website uses what is set in globe/settings.js.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../globe/project-globe.css">
  <script defer src="../globe/lib/globe.gl.min.js"></script>
  <script defer src="../globe/lib/world-countries.js"></script>
  <script defer src="../globe/project-countries.js"></script>
  <script defer src="../globe/themes.js"></script>
  <script defer src="../globe/settings.js"></script>
  <script defer src="../globe/project-globe.js"></script>

  <style>
    :root {
      --page-bg: #02050b;
      --text: #e6edf5;
      --muted: rgba(230, 237, 245, 0.6);
      --panel: rgba(10, 14, 22, 0.78);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #22d3ee;
    }

    /* Panel colours for light themes. */
    body.light {
      --text: #1d1b19;
      --muted: rgba(29, 27, 25, 0.6);
      --panel: rgba(255, 255, 255, 0.8);
      --panel-border: rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.4s;
    }

    /* Panel on top, globe filling the rest of the screen below it. */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100svh;
    }

    .hero {
      flex: 1;
      min-height: 0;
    }

    .panel {
      align-self: center;
      width: max-content;
      max-width: calc(100vw - 32px);
      margin: 16px 16px 0;
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 2;
    }

    .panel .title {
      margin: 0 0 8px;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .panel .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .panel .status {
      margin: 8px 0 0;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    .panel .status code {
      color: var(--text);
      font-size: 0.8rem;
    }

    .panel button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .panel button:hover { border-color: var(--muted); }

    .panel button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Marks the theme the website currently uses. */
    .panel button.in-use::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="panel">
    <p class="title">Selector de temas &middot; herramienta interna</p>
    <div class="row" id="theme-buttons"></div>
    <p class="status">
      <span id="theme-status"></span><br>
      <span id="speed-status"></span>
    </p>
  </div>

  <section class="hero" id="hero-globe"></section>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var container = document.getElementById("hero-globe");
      var buttonsEl = document.getElementById("theme-buttons");
      var themeStatusEl = document.getElementById("theme-status");
      var speedStatusEl = document.getElementById("speed-status");
      var settings = window.GLOBE_SETTINGS || {};
      var themeNames = Object.keys(window.GLOBE_THEMES);
      var themeInUse = settings.theme;
      var speedInUse = settings.secondsPerTurn;

      // Start from the address bar (e.g. ?theme=blueprint), else from settings.js.
      // ?lang=en etc. also works here, to see the captions in other languages.
      var params = new URLSearchParams(location.search);
      var themeName = [params.get("theme"), themeInUse, themeNames[0]].filter(function (name) {
        return themeNames.indexOf(name) !== -1;
      })[0];

      var globe = ProjectGlobe.create(container, {
        theme: themeName,
        showControls: true, // always available here, even if hidden on the website
        onSpeedChange: updateSpeedStatus,
      });
      window.previewGlobe = globe; // handy for experimenting in the browser console

      function selectTheme(name) {
        themeName = name;
        globe.setTheme(name);
        var theme = globe.getTheme();
        document.documentElement.style.setProperty("--page-bg", theme.background);
        document.documentElement.style.setProperty("--accent", solidColor(theme.accentColor || theme.highlightColor));
        document.body.classList.toggle("light", container.classList.contains("project-globe--light"));
        Array.prototype.forEach.call(buttonsEl.children, function (button) {
          button.setAttribute("aria-pressed", String(button.dataset.theme === name));
        });
        updateThemeStatus();
        saveToAddressBar();
      }

      function updateThemeStatus() {
        var inUseLabel = labelOf(themeInUse);
        if (themeName === themeInUse) {
          themeStatusEl.innerHTML = "<strong>" + inUseLabel + "</strong> es el tema que usa la web (●).";
        } else {
          themeStatusEl.innerHTML =
            "La web usa <strong>" + inUseLabel + "</strong> (●). Para cambiarlo, pon " +
            '<code>theme: "' + themeName + '"</code> en globe/settings.js';
        }
      }

      function updateSpeedStatus(secondsPerTurn) {
        if (secondsPerTurn === undefined || secondsPerTurn === speedInUse) {
          speedStatusEl.innerHTML = "Velocidad: " + describeSpeed(speedInUse) + " (como en settings.js).";
        } else {
          speedStatusEl.innerHTML =
            "Velocidad: " + describeSpeed(secondsPerTurn) + ". Para dejarla por defecto, pon " +
            "<code>secondsPerTurn: " + secondsPerTurn + "</code> en globe/settings.js";
        }
      }

      function describeSpeed(secondsPerTurn) {
        return secondsPerTurn > 0 ? "una vuelta cada " + secondsPerTurn + " s" : "sin rotación";
      }

      function labelOf(name) {
        var theme = window.GLOBE_THEMES[name];
        return theme ? theme.label || name : '"' + name + '" (no existe en themes.js)';
      }

      function saveToAddressBar() {
        var params = new URLSearchParams(location.search); // keeps ?lang= if present
        params.set("theme", themeName);
        try {
          history.replaceState(null, "", "?" + params.toString());
        } catch (error) {
          // Some browsers block this for pages opened straight from disk; it's only a convenience.
        }
      }

      // Highlight colours may be semi-transparent; text needs them fully opaque.
      function solidColor(color) {
        var ctx = document.createElement("canvas").getContext("2d");
        ctx.fillStyle = color;
        var value = ctx.fillStyle;
        if (value.charAt(0) === "#") return value;
        return "rgb(" + value.match(/[\d.]+/g).slice(0, 3).join(",") + ")";
      }

      themeNames.forEach(function (name) {
        var button = document.createElement("button");
        button.type = "button";
        button.dataset.theme = name;
        button.textContent = labelOf(name);
        if (name === themeInUse) {
          button.classList.add("in-use");
          button.setAttribute("aria-description", "Es el tema que usa la web");
        }
        button.addEventListener("click", function () { selectTheme(name); });
        buttonsEl.appendChild(button);
      });

      // Left/right arrow keys cycle through themes.
      document.addEventListener("keydown", function (event) {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        if (event.target.tagName === "INPUT") return; // let the arrows move the speed slider
        var step = event.key === "ArrowRight" ? 1 : -1;
        var index = (themeNames.indexOf(themeName) + step + themeNames.length) % themeNames.length;
        selectTheme(themeNames[index]);
      });

      updateSpeedStatus();
      selectTheme(themeName);
    });
  </script>
</body>
</html>
