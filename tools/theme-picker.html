<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Picker</title>

  <!--
    Internal tool for comparing globe themes. Not part of the website.
    The website uses the theme set in globe/settings.js.
  -->
  <script defer src="../globe/lib/globe.gl.min.js"></script>
  <script defer src="../globe/lib/world-countries.js"></script>
  <script defer src="../globe/project-countries.js"></script>
  <script defer src="../globe/themes.js"></script>
  <script defer src="../globe/settings.js"></script>
  <script defer src="../globe/project-globe.js"></script>

  <style>
    :root {
      --page-bg: #02050b;
      --text: #e6edf5;
      --muted: rgba(230, 237, 245, 0.6);
      --panel: rgba(10, 14, 22, 0.78);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #22d3ee;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.4s;
    }

    .hero {
      height: 100vh;
      height: 100svh;
    }

    .sample-text {
      position: absolute;
      left: clamp(16px, 5vw, 64px);
      bottom: clamp(140px, 18vh, 200px);
      max-width: 28rem;
      pointer-events: none;
      z-index: 1;
    }

    .sample-text .eyebrow {
      margin: 0 0 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sample-text h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 3rem);
      font-weight: 600;
      line-height: 1.1;
    }

    .sample-text h1 span { color: var(--accent); }

    .panel {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 10px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 2;
    }

    .panel .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .panel .status {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }

    .panel .status code {
      color: var(--text);
      font-size: 0.8rem;
    }

    .panel button {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .panel button:hover { border-color: rgba(255, 255, 255, 0.3); }

    .panel button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Marks the theme the website currently uses. */
    .panel button.in-use::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-left: 6px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
    }

    .panel .divider {
      width: 1px;
      align-self: stretch;
      background: var(--panel-border);
      margin: 0 4px;
    }

    .panel label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .sample-text { bottom: 230px; }
      .panel .divider { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero-globe">
    <div class="sample-text">
      <p class="eyebrow">Sample text, to judge contrast</p>
      <h1>Projects built in <span id="country-count">0</span> countries</h1>
    </div>
  </section>

  <div class="panel">
    <p class="status" id="status"></p>
    <div class="row">
      <span id="theme-buttons" style="display:contents"></span>
      <span class="divider"></span>
      <label><input type="checkbox" id="drag-toggle"> Allow dragging</label>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var container = document.getElementById("hero-globe");
      var buttonsEl = document.getElementById("theme-buttons");
      var statusEl = document.getElementById("status");
      var dragToggle = document.getElementById("drag-toggle");
      var settings = window.GLOBE_SETTINGS || {};
      var themeNames = Object.keys(window.GLOBE_THEMES);
      var themeInUse = settings.theme;

      // Start from the address bar (e.g. ?theme=blueprint&drag=1), else from settings.js.
      var params = new URLSearchParams(location.search);
      var themeName = [params.get("theme"), themeInUse, themeNames[0]].filter(function (name) {
        return themeNames.indexOf(name) !== -1;
      })[0];
      dragToggle.checked = params.has("drag") ? params.get("drag") === "1" : Boolean(settings.allowDragging);

      var globe = null;

      function buildGlobe() {
        if (globe) globe.destroy();
        globe = ProjectGlobe.create(container, {
          theme: themeName,
          allowDragging: dragToggle.checked,
        });
        window.previewGlobe = globe; // handy for experimenting in the browser console
        var shown = window.PROJECT_COUNTRIES.length - globe.unknownCountries.length;
        document.getElementById("country-count").textContent = shown;
      }

      function selectTheme(name) {
        themeName = name;
        globe.setTheme(name);
        var theme = globe.getTheme();
        document.documentElement.style.setProperty("--page-bg", theme.background);
        document.documentElement.style.setProperty("--accent", solidColor(theme.highlightColor));
        Array.prototype.forEach.call(buttonsEl.children, function (button) {
          button.setAttribute("aria-pressed", String(button.dataset.theme === name));
        });
        updateStatus();
        saveToAddressBar();
      }

      function updateStatus() {
        var inUseLabel = labelOf(themeInUse);
        if (themeName === themeInUse) {
          statusEl.innerHTML = "<strong>" + inUseLabel + "</strong> is the theme the website uses (●).";
        } else {
          statusEl.innerHTML =
            "The website uses <strong>" + inUseLabel + "</strong> (●). To switch to this one, set " +
            '<code>theme: "' + themeName + '"</code> in globe/settings.js';
        }
      }

      function labelOf(name) {
        var theme = window.GLOBE_THEMES[name];
        return theme ? theme.label || name : '"' + name + '" (not found in themes.js)';
      }

      function saveToAddressBar() {
        var query = "?theme=" + encodeURIComponent(themeName) + (dragToggle.checked ? "&drag=1" : "&drag=0");
        try {
          history.replaceState(null, "", query);
        } catch (error) {
          // Some browsers block this for pages opened straight from disk; it's only a convenience.
        }
      }

      // Highlight colours may be semi-transparent; text needs them fully opaque.
      function solidColor(color) {
        var ctx = document.createElement("canvas").getContext("2d");
        ctx.fillStyle = color;
        var value = ctx.fillStyle;
        if (value.charAt(0) === "#") return value;
        return "rgb(" + value.match(/[\d.]+/g).slice(0, 3).join(",") + ")";
      }

      themeNames.forEach(function (name) {
        var button = document.createElement("button");
        button.type = "button";
        button.dataset.theme = name;
        button.textContent = labelOf(name);
        if (name === themeInUse) {
          button.classList.add("in-use");
          button.title = "The website uses this theme";
        }
        button.addEventListener("click", function () { selectTheme(name); });
        buttonsEl.appendChild(button);
      });

      dragToggle.addEventListener("change", function () {
        buildGlobe();
        saveToAddressBar();
      });

      // Left/right arrow keys cycle through themes.
      document.addEventListener("keydown", function (event) {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        var step = event.key === "ArrowRight" ? 1 : -1;
        var index = (themeNames.indexOf(themeName) + step + themeNames.length) % themeNames.length;
        selectTheme(themeNames[index]);
      });

      buildGlobe();
      selectTheme(themeName);
    });
  </script>
</body>
</html>
