<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Globe</title>

  <!--
    Example of the globe as it will appear on the website.
    To add it to the real site: copy the globe/ folder, then copy the
    stylesheet and six scripts below, the #hero-globe element and the small
    script at the bottom.
    Theme, text, speed and controls are set in globe/settings.js.
  -->
  <link rel="stylesheet" href="globe/project-globe.css">
  <script defer src="globe/lib/globe.gl.min.js"></script>
  <script defer src="globe/lib/world-countries.js"></script>
  <script defer src="globe/project-countries.js"></script>
  <script defer src="globe/themes.js"></script>
  <script defer src="globe/settings.js"></script>
  <script defer src="globe/project-globe.js"></script>

  <style>
    html, body {
      margin: 0;
      background: #02050b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #hero-globe {
      height: 100vh;
      height: 100svh;
    }
  </style>
</head>
<body>
  <section id="hero-globe"></section>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      ProjectGlobe.create(document.getElementById("hero-globe"));
    });
  </script>
</body>
</html>
