<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestros proyectos en el mundo</title>

  <!--
    The globe page. This is what the Wix site will show inside an
    "Embed a site" box, so it only contains the globe: the headline and
    buttons beside it are Wix's own. The globe fills whatever size the box has.
    To preview it inside a mock of the Wix home page, open tools/wix-preview.html.

    Theme, text, speed and controls are set in globe/settings.js.
  -->

  <!-- Inter, the font the Wix site uses. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">

  <link rel="stylesheet" href="globe/project-globe.css">
  <script defer src="globe/lib/globe.gl.min.js"></script>
  <script defer src="globe/lib/world-countries.js"></script>
  <script defer src="globe/project-countries.js"></script>
  <script defer src="globe/themes.js"></script>
  <script defer src="globe/settings.js"></script>
  <script defer src="globe/project-globe.js"></script>

  <style>
    html, body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #globe {
      height: 100vh;
      height: 100svh;
    }
  </style>
</head>
<body>
  <div id="globe"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      ProjectGlobe.create(document.getElementById("globe"));
    });
  </script>
</body>
</html>
